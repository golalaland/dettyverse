<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · DETTYVERSE</title>
  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000; --bg-soft: #050505; --red: #FF0844; --red-bright: #FF2050;
      --red-deep: #C2005F; --glow: #FF0055; --glow-soft: #FF2D6B; --pink-soft: #FFE3EC;
      --text: #e8e8e8; --text-dim: #888888; --text-muted: #555555;
      --border: rgba(255, 255, 255, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
      line-height: 1.5; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    #loader {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader img { width: min(280px, 60vw); height: auto; opacity: 0; animation: logoIn 1.2s ease 0.15s forwards; }
    @keyframes logoIn {
      0% { opacity: 0; transform: scale(0.96); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .login-wrap {
      width: 100%; max-width: 380px; padding: 2rem 1.5rem; text-align: center;
    }
    .login-logo {
      margin-bottom: 3rem;
    }
    .login-logo img {
      height: 48px; width: auto;
    }
    .login-form {
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .field {
      text-align: left;
    }
    .field label {
      display: block; font-size: 0.6rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%; background: transparent; border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 0.95rem;
      padding: 0.85rem 1rem; outline: none; transition: border-color 0.25s;
    }
    .field input:focus {
      border-color: rgba(255, 8, 68, 0.5);
    }
    .field input::placeholder { color: var(--text-muted); }
    .btn-submit {
      margin-top: 0.75rem; width: 100%;
      background: transparent; border: 1px solid rgba(255, 8, 68, 0.5);
      color: var(--red); font-family: inherit; font-size: 0.75rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 1rem; cursor: pointer; transition: all 0.3s ease;
    }
    .btn-submit:hover {
      background: rgba(255, 8, 68, 0.12);
      box-shadow: 0 0 25px rgba(255, 8, 68, 0.25);
      border-color: var(--red);
    }
    .login-links {
      margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem;
    }
    .login-links a {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none; transition: color 0.25s;
    }
    .login-links a:hover { color: var(--text); }
    .back-home {
      position: absolute; top: 1.5rem; left: 1.5rem;
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none; transition: color 0.25s;
    }
    .back-home:hover { color: var(--text); }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
  </div>

  <a href="index.html" class="back-home">← Home</a>

  <div class="login-wrap">
    <div class="login-logo">
      <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
    </div>
    <form class="login-form" onsubmit="event.preventDefault(); location.href='account.html';">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit">Enter</button>
    </form>
    <div class="login-links">
      <a href="#">Forgot password</a>
      <a href="members.html">Create account</a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1000);
    });
  </script>
</body>
</html>
