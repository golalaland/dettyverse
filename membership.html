<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Members — DETTYVERSE</title>
<meta name="description" content="DETTYVERSE membership — $99.99 a month for the private archive." />
<link rel="canonical" href="https://dettyverse.example/membership.html" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }

  .private-landing {
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--space-6) var(--edge);
    position: relative;
    overflow: hidden;
  }
  .private-landing__glow {
    position: absolute; top: 50%; left: 50%;
    width: 1000px; height: 560px;
    transform: translate(-50%,-50%);
    background: radial-gradient(ellipse, rgba(255,8,68,0.22) 0%, rgba(255,8,68,0) 70%);
    pointer-events: none;
  }
  .private-landing__content { position: relative; z-index: 1; max-width: 440px; }
  .private-landing__eyebrow { font-size: var(--text-xs); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ivory-dim); margin-bottom: var(--space-4); }
  .private-landing__title { font-size: clamp(2rem, 5vw, var(--text-2xl)); margin-bottom: var(--space-3); line-height: 1.1; }
  .private-landing__sub { color: var(--ivory-dim); margin-bottom: var(--space-5); }
  .private-landing__price { font-family: var(--font-display); font-size: var(--text-2xl); margin-bottom: var(--space-1); }
  .private-landing__cycle { font-size: var(--text-xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--space-5); }

  .glimpse-strip { padding: 0 0 var(--space-7); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="dv-nav"></div>

<main id="main">
  <section class="private-landing">
    <div class="private-landing__glow"></div>
    <div class="private-landing__content">
      <div class="private-landing__eyebrow">The Private Archive</div>
      <h1 class="private-landing__title">Some things aren't public.</h1>
      <p class="private-landing__sub">Membership unlocks the rest of DettyVerse.</p>
      <div class="private-landing__price">$99.99</div>
      <div class="private-landing__cycle">One Month</div>
      <button class="btn btn--primary" id="ctaTop">Enter the Verse</button>
    </div>
  </section>

  <div class="container glimpse-strip">
    <div class="rhythm-grid" id="previewGrid"></div>
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  // A tasteful glimpse — private items still show, just darkened.
  document.getElementById("previewGrid").innerHTML = DV.photos.map((p, i) => DVApp.photoCardHtml(p, i)).join("");

  function handleJoin() {
    if (!DVAuth.isSignedIn()) {
      window.location.href = "signin.html?next=checkout.html";
      return;
    }
    window.location.href = "checkout.html";
  }
  document.getElementById("ctaTop").addEventListener("click", handleJoin);

  if (DVAuth.isMember()) {
    const btn = document.getElementById("ctaTop");
    btn.textContent = "You're In — Go to the Verse";
    btn.addEventListener("click", () => window.location.href = "dashboard.html");
  }
</script>
</body>
</html>
