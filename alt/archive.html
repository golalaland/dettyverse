<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archive — DETTYVERSE</title>
<meta name="description" content="The photography archive of DETTYVERSE. Portraiture, editorial, nightlife and visual diary work." />
<link rel="canonical" href="https://dettyverse.example/archive.html" />
<link rel="icon" href="data:," />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4, .nav__wordmark, .site-footer__brand { font-family: 'Fraunces', var(--font-display); }
  .page-head { padding: calc(var(--space-8) + 2rem) 0 var(--space-6); }
  .page-head__eyebrow { margin-bottom: var(--space-3); }
  .page-head__title { font-size: clamp(2.5rem, 6vw, var(--text-3xl)); margin-bottom: var(--space-3); }
  .page-head__desc { color: var(--ivory-dim); max-width: 56ch; font-size: var(--text-md); line-height: 1.6; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="dv-nav"></div>

<main id="main">
  <div class="container page-head">
    <div class="meta-label page-head__eyebrow">The Archive</div>
    <h1 class="page-head__title">Photography</h1>
    <p class="page-head__desc">A running collection of portraiture, editorial work, nightlife and visual diary entries. Some of it public. Most of what matters, not.</p>
  </div>

  <div class="container">
    <div class="filter-bar" id="filterBar">
      <button data-filter="all" class="is-active">All Work</button>
      <button data-filter="Portraiture">Portraiture</button>
      <button data-filter="Editorial">Editorial</button>
      <button data-filter="Nightlife">Nightlife</button>
      <button data-filter="Visual Diary">Visual Diary</button>
    </div>
    <div class="masonry-grid" id="archiveGrid" style="margin-bottom: var(--space-8);"></div>
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  const grid = document.getElementById("archiveGrid");
  const filterBar = document.getElementById("filterBar");
  let activeFilter = "all";

  function renderGrid() {
    const items = activeFilter === "all"
      ? DV.photos
      : DV.photos.filter(p => p.category === activeFilter);
    grid.innerHTML = items.map(p => DVApp.photoCardHtml(p)).join("");

    // Wire lightbox for unlocked images (locked ones route to membership via href)
    grid.querySelectorAll(".media-card:not(.media-card--locked)").forEach((card) => {
      card.addEventListener("click", (e) => {
        e.preventDefault();
        const id = card.dataset.id;
        const idx = items.findIndex(p => p.id === id);
        DVApp.openLightbox(items, idx);
      });
    });
  }

  filterBar.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    filterBar.querySelectorAll("button").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    activeFilter = btn.dataset.filter;
    renderGrid();
  });

  renderGrid();
</script>
</body>
</html>
