<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — DETTYVERSE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4, .nav__wordmark, .site-footer__brand { font-family: 'Fraunces', var(--font-display); }
</style>
</head>
<body>
<div id="dv-nav"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="meta-label auth-card__eyebrow">Unlock the Verse</div>
      <h1 class="auth-card__title">Confirm Membership</h1>

      <div class="checkout-summary">
        <div class="checkout-summary__row"><span>DettyVerse Membership</span><span>$99.99</span></div>
        <div class="checkout-summary__row"><span>Billing cycle</span><span>Monthly</span></div>
        <div class="checkout-summary__row checkout-summary__row--total"><span>Total due today</span><span>$99.99</span></div>
      </div>

      <!-- TODO(backend): replace this entire form with a real payment
           element — Stripe Checkout / Payment Element (or equivalent).
           Card data should never touch your own server directly; use
           the payment provider's hosted fields / tokenization.
           On success, the provider webhook (not this form) should be
           the source of truth that activates membership server-side. -->
      <form id="payForm">
        <div class="field">
          <label for="cardName">Name on Card</label>
          <input type="text" id="cardName" placeholder="A. Vale" required />
        </div>
        <div class="field">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" inputmode="numeric" required />
        </div>
        <div style="display:flex; gap: var(--space-3);">
          <div class="field" style="flex:1;">
            <label for="exp">Expiry</label>
            <input type="text" id="exp" placeholder="MM / YY" required />
          </div>
          <div class="field" style="flex:1;">
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" placeholder="123" required />
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="payBtn">Pay $99.99 & Enter</button>
      </form>
      <p class="auth-card__foot">This is a simulated checkout for prototype purposes. No payment is processed.</p>
    </div>
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  if (!DVAuth.isSignedIn()) {
    window.location.href = "signin.html?next=checkout.html";
  }

  document.getElementById("payForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const btn = document.getElementById("payBtn");
    btn.textContent = "Processing…";
    btn.disabled = true;
    setTimeout(() => {
      DVAuth.becomeMember();
      window.location.href = "dashboard.html?welcome=1";
    }, 900);
  });
</script>
</body>
</html>
