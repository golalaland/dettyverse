<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Product — DETTYVERSE</title>
<meta name="description" id="pageDesc" content="A digital release from DETTYVERSE." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="dv-nav"></div>

<main id="main">
  <div class="container" id="productRoot"></div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const product = DV.products.find(p => p.id === params.get("id"));
  const root = document.getElementById("productRoot");

  if (!product) {
    root.innerHTML = `
      <div class="detail-head">
        <h1 class="detail-head__title">Not Found</h1>
        <a href="store.html" class="btn btn--ghost" style="margin-top: var(--space-4); display:inline-flex;">Back to Store</a>
      </div>
    `;
  } else {
    document.getElementById("pageTitle").textContent = `${product.title} — DETTYVERSE Store`;
    document.getElementById("pageDesc").content = product.desc;
    root.innerHTML = `
      <div class="product-detail">
        <div class="product-detail__img"><img src="${product.cover}" alt="${product.title}" /></div>
        <div>
          <div class="meta-label" style="margin-bottom: var(--space-3);">${product.type}</div>
          <h1 class="product-detail__title">${product.title}</h1>
          <p class="product-detail__desc">${product.desc}</p>
          <div class="product-detail__price">$${product.price}</div>
          <button class="btn btn--primary" id="buyBtn">Buy Now</button>
          <p style="margin-top: var(--space-4); font-size: var(--text-xs); color: var(--muted);">
            Instant digital delivery. TODO(backend): connect to a real payment
            provider (Stripe/Gumroad-style checkout) and issue signed,
            time-limited download links after payment confirmation server-side.
          </p>
        </div>
      </div>
    `;
    document.getElementById("buyBtn").addEventListener("click", () => {
      const btn = document.getElementById("buyBtn");
      btn.textContent = "Processing…";
      setTimeout(() => {
        btn.textContent = "Purchased ✓";
        DVApp.toast(`${product.title} — purchase simulated`);
      }, 700);
    });
  }
</script>
</body>
</html>
