<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shorties · DETTYVERSE</title>
  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000; --bg-soft: #050505; --red: #FF0844; --red-bright: #FF2050;
      --red-deep: #C2005F; --glow: #FF0055; --glow-soft: #FF2D6B; --pink-soft: #FFE3EC;
      --text: #e8e8e8; --text-dim: #888888; --text-muted: #555555;
      --border: rgba(255, 255, 255, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
      line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    #loader {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader img { width: min(280px, 60vw); height: auto; opacity: 0; animation: logoIn 1.2s ease 0.15s forwards; }
    @keyframes logoIn {
      0% { opacity: 0; transform: scale(0.96); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
    }
    .logo-link { display: block; line-height: 0; }
    .logo-link img { height: 42px; width: auto; max-width: 260px; display: block; }
    @media (max-width: 768px) { .logo-link img { height: 34px; max-width: 210px; } }
    nav { display: flex; align-items: center; gap: 2.25rem; }
    nav a {
      color: var(--text-dim); text-decoration: none; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase; transition: color 0.25s ease;
    }
    nav a:hover, nav a.active { color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .btn-enter {
      color: var(--red); text-decoration: none; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      border: 1px solid rgba(255, 8, 68, 0.4); padding: 0.45rem 1rem; transition: all 0.25s ease;
    }
    .btn-enter:hover {
      background: rgba(255, 8, 68, 0.12); border-color: var(--red);
      box-shadow: 0 0 20px rgba(255, 8, 68, 0.25);
    }
    .menu-toggle {
      display: none; background: none; border: none; color: var(--text);
      font-size: 0.7rem; letter-spacing: 0.15em; cursor: pointer; text-transform: uppercase;
    }
    .mobile-nav {
      display: none; position: fixed; inset: 0; background: #000; z-index: 99;
      flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      color: var(--text-dim); text-decoration: none; font-size: 0.85rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }
    .mobile-nav a:hover { color: var(--text); }

    /* DESKTOP WALL */
    .desktop-wall {
      padding: 6rem 1.5rem 4rem; max-width: 1600px; margin: 0 auto;
    }
    .page-intro {
      margin-bottom: 2.5rem;
    }
    .page-intro h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: 0.02em; margin-bottom: 0.35rem;
    }
    .page-intro p {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-muted);
    }
    .shorties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .shortie-card {
      position: relative; aspect-ratio: 9/16; overflow: hidden;
      background: #0a0a0a; cursor: pointer;
    }
    .shortie-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.6s ease;
    }
    .shortie-card:hover img { transform: scale(1.05); }
    .shortie-card .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 45%);
      opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 1rem;
    }
    .shortie-card:hover .overlay { opacity: 1; }
    .shortie-card .play {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .shortie-card .play::after {
      content: ''; width: 0; height: 0;
      border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
      margin-left: 2px;
    }
    .shortie-card .info {
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.8);
    }
    .shortie-card .info strong { display: block; color: #fff; margin-bottom: 0.15rem; font-weight: 400; }

    /* MOBILE FEED */
    .mobile-feed {
      display: none;
      position: fixed; inset: 0; top: 0; z-index: 50;
      overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .feed-item {
      height: 100vh; height: 100dvh; scroll-snap-align: start;
      position: relative; background: #000;
    }
    .feed-item img, .feed-item video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .feed-meta {
      position: absolute; bottom: 5rem; left: 1.25rem; right: 1.25rem;
      z-index: 5; pointer-events: none;
    }
    .feed-meta h3 {
      font-size: 0.85rem; font-weight: 400; letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 0.25rem;
    }
    .feed-meta span {
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim);
    }
    .feed-progress {
      position: absolute; top: 0; left: 0; height: 2px; background: var(--red);
      width: 0; z-index: 6; transition: width 0.1s linear;
    }
    .feed-hint {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted); z-index: 5;
    }

    /* IMMERSIVE VIEWER (desktop click) */
    #viewer {
      position: fixed; inset: 0; background: #000; z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    #viewer.open { display: flex; }
    #viewer .viewer-inner {
      position: relative; width: min(420px, 90vw); aspect-ratio: 9/16;
      background: #0a0a0a; overflow: hidden;
    }
    #viewer img, #viewer video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .viewer-close {
      position: absolute; top: 1.25rem; right: 1.5rem; background: none; border: none;
      color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.18em;
      text-transform: uppercase; cursor: pointer; z-index: 10;
    }
    .viewer-close:hover { color: var(--text); }
    .viewer-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted);
      font-size: 1.4rem; cursor: pointer; padding: 0.75rem; z-index: 10;
    }
    .viewer-nav:hover { color: var(--text); }
    .viewer-prev { left: 0.5rem; }
    .viewer-next { right: 0.5rem; }
    .viewer-meta {
      position: absolute; bottom: 1.5rem; left: 1.25rem; right: 1.25rem;
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }
    .viewer-meta strong { display: block; color: #fff; margin-bottom: 0.2rem; font-weight: 400; }

    footer {
      padding: 3rem 2.5rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;
    }
    footer .footer-logo img { height: 22px; width: auto; opacity: 0.7; }
    footer .footer-links { display: flex; gap: 1.75rem; flex-wrap: wrap; }
    footer .footer-links a {
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none; transition: color 0.25s;
    }
    footer .footer-links a:hover { color: var(--text); }
    footer .copyright { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; }

    @media (max-width: 900px) {
      header { padding: 1rem 1.25rem; }
      nav { display: none; }
      .menu-toggle { display: block; }
      .desktop-wall { display: none; }
      .mobile-feed { display: block; }
      footer { display: none; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
  </div>

  <header id="header">
    <a href="index.html" class="logo-link">
      <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
    </a>
    <nav>
      <a href="photos.html">Photos</a>
      <a href="clips.html">Clips</a>
      <a href="shorties.html" class="active">Shorties</a>
      <a href="stories.html">Stories</a>
    </nav>
    <div class="header-right">
      <a href="members.html" class="btn-enter">Enter</a>
      <button class="menu-toggle" id="menuToggle">Menu</button>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="photos.html" onclick="closeMobile()">Photos</a>
    <a href="clips.html" onclick="closeMobile()">Clips</a>
    <a href="shorties.html" onclick="closeMobile()">Shorties</a>
    <a href="stories.html" onclick="closeMobile()">Stories</a>
    <a href="members.html" onclick="closeMobile()">Members</a>
    <a href="about.html" onclick="closeMobile()">About</a>
    <a href="login.html" onclick="closeMobile()" style="margin-top:1rem;color:var(--red)">Login</a>
  </div>

  <!-- DESKTOP WALL -->
  <div class="desktop-wall">
    <div class="page-intro">
      <h1>Shorties</h1>
      <p>Vertical Archive</p>
    </div>
    <div class="shorties-grid" id="shortiesGrid">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- MOBILE FEED -->
  <div class="mobile-feed" id="mobileFeed">
    <!-- populated by JS -->
  </div>

  <footer>
    <a href="index.html" class="footer-logo">
      <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
    </a>
    <div class="footer-links">
      <a href="photos.html">Photos</a>
      <a href="clips.html">Clips</a>
      <a href="shorties.html">Shorties</a>
      <a href="stories.html">Stories</a>
      <a href="members.html">Members</a>
      <a href="about.html">About</a>
      <a href="login.html">Login</a>
    </div>
    <span class="copyright">© 2026</span>
  </footer>

  <div id="viewer">
    <button class="viewer-close" onclick="closeViewer()">Close</button>
    <button class="viewer-nav viewer-prev" onclick="navViewer(-1)">‹</button>
    <button class="viewer-nav viewer-next" onclick="navViewer(1)">›</button>
    <div class="viewer-inner">
      <img id="viewerImg" src="" alt="" />
      <div class="viewer-meta" id="viewerMeta"></div>
    </div>
  </div>

  <script>
    const shorties = [
      { src: 'https://images.unsplash.com/photo-1618005182384-a83b0c7b0d0e?w=700&q=80', title: 'Midnight Motion', duration: '0:24', date: 'Mar 2026' },
      { src: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700&q=80', title: 'Portrait Study', duration: '0:18', date: 'Feb 2026' },
      { src: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=700&q=80', title: 'Soft Red', duration: '0:31', date: 'Feb 2026' },
      { src: 'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=700&q=80', title: 'Edge of City', duration: '0:22', date: 'Jan 2026' },
      { src: 'https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=700&q=80', title: 'After Lights', duration: '0:27', date: 'Jan 2026' },
      { src: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=700&q=80', title: 'Private Hours', duration: '0:19', date: 'Dec 2025' },
      { src: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700&q=80', title: 'Quiet Frame', duration: '0:35', date: 'Dec 2025' },
      { src: 'https://images.unsplash.com/photo-1502823403499-6ccfcf4fb453?w=700&q=80', title: 'Residual Glow', duration: '0:21', date: 'Nov 2025' },
    ];

    // Desktop grid
    const grid = document.getElementById('shortiesGrid');
    shorties.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'shortie-card';
      card.onclick = () => openViewer(i);
      card.innerHTML = `
        <img src="${s.src}" alt="" loading="lazy" />
        <div class="overlay">
          <div class="play"></div>
          <div class="info"><strong>${s.title}</strong>${s.duration}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    // Mobile feed
    const feed = document.getElementById('mobileFeed');
    shorties.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerHTML = `
        <div class="feed-progress" id="prog${i}"></div>
        <img src="${s.src}" alt="" />
        <div class="feed-meta">
          <h3>${s.title}</h3>
          <span>${s.duration} · ${s.date}</span>
        </div>
        <div class="feed-hint">Swipe</div>
      `;
      feed.appendChild(item);
    });

    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1200);
    });
    const menuToggle = document.getElementById('menuToggle');
    const mobileNav = document.getElementById('mobileNav');
    menuToggle.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
      menuToggle.textContent = mobileNav.classList.contains('open') ? 'Close' : 'Menu';
    });
    function closeMobile() {
      mobileNav.classList.remove('open');
      menuToggle.textContent = 'Menu';
    }

    let currentIndex = 0;
    function openViewer(index) {
      currentIndex = index;
      const s = shorties[index];
      document.getElementById('viewerImg').src = s.src;
      document.getElementById('viewerMeta').innerHTML = `<strong>${s.title}</strong>${s.duration} · ${s.date}`;
      document.getElementById('viewer').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeViewer() {
      document.getElementById('viewer').classList.remove('open');
      document.body.style.overflow = '';
    }
    function navViewer(dir) {
      currentIndex = (currentIndex + dir + shorties.length) % shorties.length;
      openViewer(currentIndex);
    }
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('viewer').classList.contains('open')) return;
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowLeft') navViewer(-1);
      if (e.key === 'ArrowRight') navViewer(1);
    });
  </script>
</body>
</html>
