<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">DETTYVERSE</title>
<meta name="description" id="pageDesc" content="From the DETTYVERSE archive." />
<meta name="robots" id="robotsTag" content="index, follow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="dv-nav"></div>

<main id="main">
  <div class="container" id="contentRoot">
    <!-- populated by JS -->
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type") || "photo";
  const id = params.get("id");
  const root = document.getElementById("contentRoot");

  function findItem() {
    if (type === "photo") return DV.photos.find(p => p.id === id);
    if (type === "film") return DV.films.find(f => f.id === id);
    if (type === "story") return DV.stories.find(s => s.id === id);
    return null;
  }

  const item = findItem();

  if (!item) {
    root.innerHTML = `
      <div class="detail-head">
        <h1 class="detail-head__title">Not Found</h1>
        <p class="detail-head__desc">This piece doesn't exist, or has been removed from the archive.</p>
        <a href="photos.html" class="btn btn--ghost" style="margin-top: var(--space-4); display:inline-flex;">Back to Archive</a>
      </div>
    `;
  } else {
    const locked = item.visibility === "members" && !DVAuth.isMember();
    document.getElementById("pageTitle").textContent = `${locked ? "Private Archive" : item.title} — DETTYVERSE`;
    document.getElementById("pageDesc").content = locked ? "This piece is reserved for members." : (item.desc || item.excerpt || "");
    if (locked) document.getElementById("robotsTag").content = "noindex, nofollow";

    if (locked) {
      root.innerHTML = `
        <div class="locked-room" style="margin-top: 72px;">
          <div class="locked-room__bg"><img src="${item.img || item.thumb || item.cover}" alt="" /></div>
          <div class="locked-room__content">
            <svg class="locked-room__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <div class="locked-room__eyebrow">Private Archive</div>
            <h1 class="locked-room__title">This room is reserved for members.</h1>
            <p class="locked-room__desc">What you're looking for exists — it's just kept for the people who came inside.</p>
            <div class="locked-room__price">$99.99 <span>/ 1 Month</span></div>
            <a href="membership.html" class="btn btn--primary">Unlock the Verse</a>
          </div>
        </div>
      `;
    } else if (type === "photo") {
      renderPhoto(item);
    } else if (type === "film") {
      renderFilm(item);
    } else if (type === "story") {
      renderStory(item);
    }
  }

  function relatedHtml() {
    if (type === "photo") {
      const related = DV.photos.filter(p => p.id !== id).slice(0, 4);
      return related.map(p => DVApp.photoCardHtml(p)).join("");
    }
    if (type === "film") {
      const related = DV.films.filter(f => f.id !== id).slice(0, 4);
      return related.map(f => DVApp.clipCardHtml(f)).join("");
    }
    const related = DV.stories.filter(s => s.id !== id).slice(0, 4);
    return related.map(s => DVApp.storyCardHtml(s)).join("");
  }

  function renderPhoto(p) {
    root.innerHTML = `
      <div class="detail-head">
        <div class="detail-head__meta">${DVApp.visibilityBadge(p)}<span class="meta-label">${p.category} · ${p.date}</span></div>
        <h1 class="detail-head__title">${p.title}</h1>
        <p class="detail-head__desc">${p.desc}</p>
      </div>
      <div class="detail-media"><img src="${p.img}" alt="${p.title}" /></div>
      <div class="detail-note">
        <h4>Creator Note</h4>
        <p>Shot on available light, sequenced into the archive without heavy retouching. Part of the ${p.category} series.</p>
      </div>
      <div class="section-head" style="margin-top: var(--space-7);">
        <h2 class="section-head__title">From the Archive</h2>
        <a href="photos.html" class="section-head__link">View All</a>
      </div>
      <div class="related-strip" style="margin-bottom: var(--space-8);">${relatedHtml()}</div>
    `;
  }

  function renderFilm(f) {
    const orientClass = f.orientation === "portrait" ? "video-player--portrait"
      : f.orientation === "square" ? "video-player--square"
      : "video-player--landscape";
    root.innerHTML = `
      <div class="detail-head">
        <div class="detail-head__meta">${DVApp.visibilityBadge(f)}<span class="meta-label">${f.category} · ${f.duration} · ${f.date}</span></div>
        <h1 class="detail-head__title">${f.title}</h1>
        <p class="detail-head__desc">${f.desc}</p>
      </div>
      <div class="video-player ${orientClass}" id="videoPlayer">
        <img src="${f.thumb}" alt="${f.title}" />
        <div class="video-player__overlay">
          <div class="video-player__play">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--ivory)"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-player__bar"><span>${f.title}</span><span>${f.duration}</span></div>
      </div>
      <div class="section-head" style="margin-top: var(--space-6);">
        <h2 class="section-head__title">More Clips</h2>
        <a href="clips.html" class="section-head__link">View All</a>
      </div>
      <div class="related-strip" style="margin-bottom: var(--space-8);">${relatedHtml()}</div>
    `;
    document.getElementById("videoPlayer").addEventListener("click", () => {
      DVApp.toast("Playback is simulated in this prototype");
    });
  }

  function renderStory(s) {
    root.innerHTML = `
      <div class="detail-head">
        <div class="detail-head__meta">${DVApp.visibilityBadge(s)}<span class="meta-label">${s.category} · ${s.date}</span></div>
        <h1 class="detail-head__title">${s.title}</h1>
      </div>
      <div class="detail-media" style="max-height:64vh;"><img src="${s.cover}" alt="${s.title}" style="max-height:64vh;" /></div>
      <article class="article-body">
        ${s.body.map(p => `<p>${p}</p>`).join("")}
      </article>
      <div class="section-head" style="margin-top: var(--space-7);">
        <h2 class="section-head__title">More From the Journal</h2>
        <a href="stories.html" class="section-head__link">View All</a>
      </div>
      <div class="related-strip" style="margin-bottom: var(--space-8);">${relatedHtml()}</div>
    `;
  }
</script>
</body>
</html>
