<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Dashboard — DETTYVERSE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }
  .admin-sidebar__brand { height: 20px; margin-bottom: var(--space-6); display: block; }
  .admin-sidebar__brand img { height: 100%; width: auto; }
  .stat-strip {
    display: flex; gap: var(--space-6);
    padding: var(--space-3) 0 var(--space-5);
    border-bottom: 1px solid var(--surface-line);
    margin-bottom: var(--space-5);
    flex-wrap: wrap;
  }
  .stat-strip__item { }
  .stat-strip__label { font-size: var(--text-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .stat-strip__value { font-family: var(--font-display); font-size: var(--text-lg); }
</style>
</head>
<body>

<!--
  TODO(backend): This admin surface must sit behind real creator-only
  authentication and authorization (not the mock member session used
  elsewhere in this prototype). All data below is static/mock.
-->

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="index.html" class="admin-sidebar__brand"><img src="assets/dettyverse-logo.webp" alt="DettyVerse" /></a>
    <nav class="admin-nav" id="adminNav">
      <button data-panel="overview" class="is-active">Overview</button>
      <button data-panel="photos">Photos</button>
      <button data-panel="clips">Clips</button>
      <button data-panel="stories">Stories</button>
    </nav>
    <a href="index.html" class="admin-sidebar__back">← Back to Site</a>
  </aside>

  <div class="admin-main">

    <!-- OVERVIEW -->
    <section class="admin-panel is-active" id="panel-overview">
      <div class="admin-header"><h1>Overview</h1></div>
      <div class="stat-strip">
        <div class="stat-strip__item"><div class="stat-strip__label">Members</div><div class="stat-strip__value">1,204</div></div>
        <div class="stat-strip__item"><div class="stat-strip__label">Active</div><div class="stat-strip__value">1,142</div></div>
        <div class="stat-strip__item"><div class="stat-strip__label">Monthly Revenue</div><div class="stat-strip__value">$114,182</div></div>
      </div>
      <p style="color:var(--ivory-dim); font-size: var(--text-sm); margin-bottom: var(--space-6); max-width: 50ch;">
        Manage content from the tabs on the left. Mark items Public or Private, feature them, or take them down.
      </p>
    </section>

    <!-- PHOTOS -->
    <section class="admin-panel" id="panel-photos">
      <div class="admin-header">
        <h1>Photos</h1>
        <button class="btn btn--primary" data-new="photo">Upload Photo</button>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>Title</th><th>Category</th><th>Visibility</th><th></th></tr></thead>
        <tbody id="photosBody"></tbody>
      </table>
    </section>

    <!-- CLIPS -->
    <section class="admin-panel" id="panel-clips">
      <div class="admin-header">
        <h1>Clips</h1>
        <button class="btn btn--primary" data-new="clip">Upload Clip</button>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>Title</th><th>Duration</th><th>Visibility</th><th></th></tr></thead>
        <tbody id="clipsBody"></tbody>
      </table>
    </section>

    <!-- STORIES -->
    <section class="admin-panel" id="panel-stories">
      <div class="admin-header">
        <h1>Stories</h1>
        <button class="btn btn--primary" data-new="story">New Story</button>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>Title</th><th>Category</th><th>Visibility</th><th></th></tr></thead>
        <tbody id="storiesBody"></tbody>
      </table>
    </section>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const navBtns = document.querySelectorAll("#adminNav button");
  navBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      navBtns.forEach(b => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      document.querySelectorAll(".admin-panel").forEach(p => p.classList.remove("is-active"));
      document.getElementById(`panel-${btn.dataset.panel}`).classList.add("is-active");
    });
  });

  function statusBadge(vis) {
    return `<span class="admin-status ${vis === 'members' ? 'admin-status--members' : 'admin-status--public'}">${vis === 'members' ? 'Private' : 'Public'}</span>`;
  }
  function rowActions(kind, id) {
    return `
      <div class="admin-row-actions">
        <button data-action="edit" data-kind="${kind}" data-id="${id}">Edit</button>
        <button data-action="toggle" data-kind="${kind}" data-id="${id}">Toggle</button>
        <button data-action="feature" data-kind="${kind}" data-id="${id}">Feature</button>
        <button data-action="delete" data-kind="${kind}" data-id="${id}">Delete</button>
      </div>
    `;
  }

  document.getElementById("photosBody").innerHTML = DV.photos.map(p => `
    <tr data-id="${p.id}">
      <td><img class="admin-table__thumb" src="${p.img}" alt="" /></td>
      <td>${p.title}</td>
      <td>${p.category}</td>
      <td>${statusBadge(p.visibility)}</td>
      <td>${rowActions('photo', p.id)}</td>
    </tr>
  `).join("");

  document.getElementById("clipsBody").innerHTML = DV.films.map(f => `
    <tr data-id="${f.id}">
      <td><img class="admin-table__thumb" src="${f.thumb}" alt="" /></td>
      <td>${f.title}</td>
      <td>${f.duration}</td>
      <td>${statusBadge(f.visibility)}</td>
      <td>${rowActions('clip', f.id)}</td>
    </tr>
  `).join("");

  document.getElementById("storiesBody").innerHTML = DV.stories.map(s => `
    <tr data-id="${s.id}">
      <td><img class="admin-table__thumb" src="${s.cover}" alt="" /></td>
      <td>${s.title}</td>
      <td>${s.category}</td>
      <td>${statusBadge(s.visibility)}</td>
      <td>${rowActions('story', s.id)}</td>
    </tr>
  `).join("");

  document.querySelector(".admin-main").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (btn) {
      const action = btn.dataset.action;
      const kind = btn.dataset.kind;
      const messages = {
        edit: `Editing ${kind} — opens editor (not wired in prototype)`,
        toggle: `Visibility toggled for ${kind}`,
        feature: `${kind} marked as featured`,
        delete: `${kind} deleted (simulated)`,
      };
      DVApp.toast(messages[action] || "Action simulated");
      if (action === "delete") btn.closest("tr").style.opacity = "0.3";
      return;
    }
    const newBtn = e.target.closest("button[data-new]");
    if (newBtn) DVApp.toast(`New ${newBtn.dataset.new} — opens editor (not wired in prototype)`);
  });
</script>
</body>
</html>
