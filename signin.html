<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — DETTYVERSE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }
</style>
</head>
<body>
<div id="dv-nav"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" style="display:block; text-align:center; margin-bottom: var(--space-4);"><img src="assets/dettyverse-logo.webp" alt="DettyVerse" style="height:22px;" /></a>
      <h1 class="auth-card__title" id="formTitle">Sign In</h1>

      <!-- TODO(backend): replace with real auth provider (email/password + OTP,
           magic link, or OAuth). This form only simulates a session in
           localStorage via auth.js — it performs no real authentication. -->
      <form id="authForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full">Sign In</button>
      </form>

      <div class="auth-divider">or</div>
      <button class="btn btn--ghost btn--full" id="toggleMode">Create an Account</button>

      <p class="auth-card__foot">By continuing you agree to the DettyVerse Terms & Privacy Policy.</p>
    </div>
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next") || "dashboard.html";
  let mode = "signin";

  document.getElementById("toggleMode").addEventListener("click", () => {
    mode = mode === "signin" ? "signup" : "signin";
    document.getElementById("formTitle").textContent = mode === "signin" ? "Sign In" : "Create an Account";
    document.getElementById("toggleMode").textContent = mode === "signin" ? "Create an Account" : "Sign In Instead";
    document.querySelector("#authForm button[type=submit]").textContent = mode === "signin" ? "Sign In" : "Create Account";
  });

  document.getElementById("authForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value || "member@example.com";
    DVAuth.signIn(email);
    DVApp.toast(mode === "signin" ? "Signed in" : "Account created");
    setTimeout(() => { window.location.href = next; }, 500);
  });
</script>
</body>
</html>
