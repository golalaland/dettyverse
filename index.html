<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DETTYVERSE</title>
<meta name="description" content="DETTYVERSE — a private visual archive. Photos, clips and stories." />
<meta property="og:title" content="DETTYVERSE" />
<meta property="og:description" content="A private visual archive." />
<link rel="canonical" href="https://dettyverse.example/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }

  .splash {
    position: fixed; inset: 0; z-index: 4000;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 700ms var(--ease-out);
  }
  .splash.is-hidden { opacity: 0; pointer-events: none; }
  .splash img { height: 46px; width: auto; opacity: 0; animation: splashIn 1000ms var(--ease-out) 200ms forwards; filter: drop-shadow(0 0 24px rgba(255,8,68,0.45)); }
  @keyframes splashIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  .home-hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: var(--space-6) var(--edge);
  }
  .home-hero__bg { position: absolute; inset: 0; z-index: 0; }
  .home-hero__bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
  .home-hero__bg::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 50% 105%, rgba(255,8,68,0.28) 0%, rgba(255,8,68,0) 70%),
      linear-gradient(to bottom, rgba(6,6,7,0.55) 0%, rgba(6,6,7,0.35) 45%, rgba(6,6,7,0.98) 100%);
  }
  .home-hero__logo { position: relative; z-index: 1; height: clamp(48px, 9vw, 96px); margin-bottom: var(--space-4); filter: drop-shadow(0 0 32px rgba(255,8,68,0.3)); }
  .home-hero__tagline { position: relative; z-index: 1; color: var(--ivory-dim); font-size: var(--text-md); max-width: 34ch; margin-bottom: var(--space-5); }
  .home-hero__ctas { position: relative; z-index: 1; display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }

  .featured-block { margin-bottom: var(--space-6); }
  .home-strip-label {
    display: flex; align-items: center; gap: var(--space-2);
    margin: var(--space-6) 0 var(--space-3);
  }
  .home-strip-label span {
    font-size: var(--text-xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .home-strip-label::after { content: ''; flex: 1; height: 1px; background: var(--surface-line); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div class="splash" id="splash"><img src="assets/dettyverse-logo.webp" alt="DettyVerse" /></div>

<div id="dv-nav"></div>

<main id="main">

  <!-- HERO -->
  <section class="home-hero">
    <div class="home-hero__bg">
      <img src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?q=80&w=1920" alt="" />
    </div>
    <img class="home-hero__logo" src="assets/dettyverse-logo.webp" alt="DettyVerse" />
    <p class="home-hero__tagline">A private visual archive. Photos, clips and stories.</p>
    <div class="home-hero__ctas">
      <a href="photos.html" class="btn btn--primary">Enter</a>
      <a href="membership.html" class="btn btn--ghost">Members — $99.99</a>
    </div>
  </section>

  <!-- FEATURED -->
  <div class="container">
    <a href="content.html?type=photo&id=p02" class="featured-visual featured-block" style="display:block;">
      <img src="https://images.unsplash.com/photo-1483118714900-540cf339fd46?q=80&w=1920" alt="Featured" />
      <div class="featured-visual__caption">
        <div class="featured-visual__eyebrow">Featured · 2026</div>
        <div class="featured-visual__title">Red Room, Marseille</div>
      </div>
    </a>

    <!-- STRAIGHT INTO THE GALLERY -->
    <div class="home-strip-label"><span>Photos</span></div>
    <div class="rhythm-grid" id="homePhotoGrid"></div>

    <div class="home-strip-label"><span>Clips</span></div>
    <div class="clip-wall" id="homeClipWall"></div>

    <div class="home-strip-label"><span>Stories</span></div>
    <div class="story-grid" id="homeStoryGrid" style="margin-bottom: var(--space-6);"></div>

    <div class="home-strip-label"><span>More Photos</span></div>
    <div class="rhythm-grid" id="homePhotoGrid2" style="margin-bottom: var(--space-6);"></div>
  </div>

</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  window.addEventListener("load", () => {
    setTimeout(() => {
      const splash = document.getElementById("splash");
      splash.classList.add("is-hidden");
      setTimeout(() => splash.remove(), 750);
    }, 550);
  });

  document.getElementById("homePhotoGrid").innerHTML = DV.photos.slice(0, 8).map((p, i) => DVApp.photoCardHtml(p, i)).join("");
  document.getElementById("homeClipWall").innerHTML = DV.films.slice(0, 6).map(f => DVApp.clipCardHtml(f)).join("");
  document.getElementById("homeStoryGrid").innerHTML = DV.stories.slice(0, 3).map(s => DVApp.storyCardHtml(s)).join("");
  document.getElementById("homePhotoGrid2").innerHTML = DV.photos.slice(8, 12).map((p, i) => DVApp.photoCardHtml(p, i + 2)).join("");

  // Wire lightbox on unlocked photo cards across the homepage
  document.querySelectorAll(".rhythm-grid .media-card:not(.media-card--locked)").forEach((card) => {
    card.addEventListener("click", (e) => {
      e.preventDefault();
      const id = card.dataset.id;
      const idx = DV.photos.findIndex(p => p.id === id);
      DVApp.openLightbox(DV.photos, idx);
    });
  });
</script>
</body>
</html>
