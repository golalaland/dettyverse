<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos · DETTYVERSE</title>
  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000; --bg-soft: #050505; --red: #FF0844; --red-bright: #FF2050;
      --red-deep: #C2005F; --glow: #FF0055; --glow-soft: #FF2D6B; --pink-soft: #FFE3EC;
      --text: #e8e8e8; --text-dim: #888888; --text-muted: #555555;
      --border: rgba(255, 255, 255, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
      line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    #loader {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader img { width: min(280px, 60vw); height: auto; opacity: 0; animation: logoIn 1.2s ease 0.15s forwards; }
    @keyframes logoIn {
      0% { opacity: 0; transform: scale(0.96); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2.5rem;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo-link { display: block; line-height: 0; }
    .logo-link img { height: 42px; width: auto; max-width: 260px; display: block; }
    @media (max-width: 768px) { .logo-link img { height: 34px; max-width: 210px; } }
    nav { display: flex; align-items: center; gap: 2.25rem; }
    nav a {
      color: var(--text-dim); text-decoration: none; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase; transition: color 0.25s ease;
    }
    nav a:hover, nav a.active { color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .btn-enter {
      color: var(--red); text-decoration: none; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      border: 1px solid rgba(255, 8, 68, 0.4); padding: 0.45rem 1rem; transition: all 0.25s ease;
    }
    .btn-enter:hover {
      background: rgba(255, 8, 68, 0.12); border-color: var(--red);
      box-shadow: 0 0 20px rgba(255, 8, 68, 0.25);
    }
    .menu-toggle {
      display: none; background: none; border: none; color: var(--text);
      font-size: 0.7rem; letter-spacing: 0.15em; cursor: pointer; text-transform: uppercase;
    }
    .mobile-nav {
      display: none; position: fixed; inset: 0; background: #000; z-index: 99;
      flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      color: var(--text-dim); text-decoration: none; font-size: 0.85rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }
    .mobile-nav a:hover { color: var(--text); }

    main { padding-top: 5.5rem; }
    .page-header {
      padding: 2rem 2.5rem 1rem; max-width: 1600px; margin: 0 auto;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: 0.02em; margin-bottom: 0.35rem;
    }
    .page-header p {
      font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-muted);
    }

    .filters {
      display: flex; gap: 1.5rem; padding: 0.5rem 2.5rem 2rem;
      max-width: 1600px; margin: 0 auto;
    }
    .filters button {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; transition: color 0.25s; padding: 0;
    }
    .filters button:hover, .filters button.active { color: var(--text); }

    .gallery {
      padding: 0 1.25rem 5rem;
      display: grid; grid-template-columns: repeat(12, 1fr);
      gap: 0.75rem; max-width: 1600px; margin: 0 auto;
    }
    .gallery-item {
      position: relative; overflow: hidden; background: #0a0a0a; cursor: pointer;
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.7s ease, filter 0.4s ease;
    }
    .gallery-item:hover img { transform: scale(1.04); }
    .gallery-item.span-8 { grid-column: span 8; aspect-ratio: 16/10; }
    .gallery-item.span-4 { grid-column: span 4; aspect-ratio: 3/4; }
    .gallery-item.span-6 { grid-column: span 6; aspect-ratio: 4/5; }
    .gallery-item.span-3 { grid-column: span 3; aspect-ratio: 1/1; }
    .gallery-item.span-12 { grid-column: span 12; aspect-ratio: 21/9; }
    .gallery-item.span-5 { grid-column: span 5; aspect-ratio: 3/4; }
    .gallery-item.span-7 { grid-column: span 7; aspect-ratio: 16/11; }

    .gallery-item.private img { filter: brightness(0.35) blur(6px) saturate(0.7); }
    .gallery-item.private:hover img { filter: brightness(0.4) blur(4px) saturate(0.8); }
    .private-label {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.75rem; z-index: 2; pointer-events: none;
    }
    .private-label span {
      font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.55);
    }
    .private-label .enter {
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); border: 1px solid rgba(255, 8, 68, 0.45); padding: 0.4rem 0.9rem;
    }
    .gallery-item.private:hover .private-label .enter {
      background: rgba(255, 8, 68, 0.15); box-shadow: 0 0 18px rgba(255, 8, 68, 0.3);
    }

    /* VIEWER */
    #viewer {
      position: fixed; inset: 0; background: #000; z-index: 200;
      display: none; align-items: center; justify-content: center; flex-direction: column;
    }
    #viewer.open { display: flex; }
    #viewer img { max-width: 92vw; max-height: 88vh; object-fit: contain; display: block; }
    .viewer-close {
      position: absolute; top: 1.5rem; right: 1.75rem; background: none; border: none;
      color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.18em;
      text-transform: uppercase; cursor: pointer; z-index: 10; transition: color 0.2s;
    }
    .viewer-close:hover { color: var(--text); }
    .viewer-meta {
      position: absolute; bottom: 1.75rem; left: 50%; transform: translateX(-50%);
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted); text-align: center;
    }
    .viewer-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted);
      font-size: 1.5rem; cursor: pointer; padding: 1rem; transition: color 0.2s; z-index: 10;
    }
    .viewer-nav:hover { color: var(--text); }
    .viewer-prev { left: 1rem; }
    .viewer-next { right: 1rem; }

    footer {
      padding: 3rem 2.5rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;
    }
    footer .footer-logo img { height: 22px; width: auto; opacity: 0.7; }
    footer .footer-links { display: flex; gap: 1.75rem; flex-wrap: wrap; }
    footer .footer-links a {
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none; transition: color 0.25s;
    }
    footer .footer-links a:hover { color: var(--text); }
    footer .copyright { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; }

    @media (max-width: 900px) {
      header { padding: 1rem 1.25rem; }
      nav { display: none; }
      .menu-toggle { display: block; }
      .page-header { padding: 1.5rem 1.25rem 0.75rem; }
      .filters { padding: 0.5rem 1.25rem 1.5rem; gap: 1rem; }
      .gallery { grid-template-columns: repeat(6, 1fr); gap: 0.5rem; padding: 0 0.75rem 3rem; }
      .gallery-item.span-8, .gallery-item.span-7, .gallery-item.span-6, .gallery-item.span-5 { grid-column: span 6; }
      .gallery-item.span-4, .gallery-item.span-3 { grid-column: span 3; }
      .gallery-item.span-12 { grid-column: span 6; }
      footer { padding: 2rem 1.25rem; flex-direction: column; gap: 1rem; text-align: center; }
      footer .footer-links { justify-content: center; }
    }
    @media (max-width: 480px) {
      .gallery-item.span-4, .gallery-item.span-3 { grid-column: span 6; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />

  <header id="header">
    <a href="index.html" class="logo-link">

  <div class="mobile-nav" id="mobileNav">

      <div class="gallery-item span-4 private" data-type="private" onclick="location.href='members.html'">

      <div class="gallery-item span-4" data-type="public new" onclick="openViewer(5)">
        <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl01.webp" alt="" loading="lazy" />

      <div class="gallery-item span-5" data-type="public" onclick="openViewer(6)">

      <div class="gallery-item span-7" data-type="public" onclick="openViewer(7)">
        <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl03.webp" alt="" loading="lazy" />
      </div>
      <div class="gallery-item span-6" data-type="public new" onclick="openViewer(8)">
        <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl01.webp" alt="" loading="lazy" />
      </div>
      <div class="gallery-item span-6 private" data-type="private" onclick="location.href='members.html'">

  </main>

  <footer>
    <a href="index.html" class="footer-logo">
      <img src="https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dettyverse_neon_red_transparent_1418px.webp" alt="DETTYVERSE" />
    </a>
    <div class="footer-links">
      <a href="photos.html">Photos</a>
      <a href="clips.html">Clips</a>
      <a href="shorties.html">Shorties</a>
      <a href="stories.html">Stories</a>
      <a href="members.html">Members</a>
      <a href="about.html">About</a>
      <a href="login.html">Login</a>
    </div>
    <span class="copyright">© 2026</span>
  </footer>

  <div id="viewer">
    <button class="viewer-close" onclick="closeViewer()">Close</button>
    <button class="viewer-nav viewer-prev" onclick="navViewer(-1)">‹</button>
    <button class="viewer-nav viewer-next" onclick="navViewer(1)">›</button>
    <img id="viewerImg" src="" alt="" />
    <div class="viewer-meta" id="viewerMeta"></div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1200);
    });
    const menuToggle = document.getElementById('menuToggle');
    const mobileNav = document.getElementById('mobileNav');
    menuToggle.addEventListener('click', () => {
      mobileNav.classList.toggle('open');
      menuToggle.textContent = mobileNav.classList.contains('open') ? 'Close' : 'Menu';
    });
    function closeMobile() {
      mobileNav.classList.remove('open');
      menuToggle.textContent = 'Menu';
    }

    const archive = [
      { src: 'https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl02.webp', meta: 'Archive 001 · 2026 · Photo' },
      { src: 'https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl03.webp', meta: 'Archive 002 · 2026 · Photo' },
      { src: 'https://raw.githubusercontent.com/golalaland/dettyverse/main/assets/dv_girl01.webp', meta: 'Archive 003 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1600&q=90', meta: 'Archive 004 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1000&q=90', meta: 'Archive 005 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1502823403499-6ccfcf4fb453?w=1000&q=90', meta: 'Archive 006 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=1200&q=90', meta: 'Archive 007 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1400&q=90', meta: 'Archive 008 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=1200&q=90', meta: 'Archive 009 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000&q=90', meta: 'Archive 010 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=1000&q=90', meta: 'Archive 011 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=1000&q=90', meta: 'Archive 012 · 2026 · Photo' },
      { src: 'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=1000&q=90', meta: 'Archive 013 · 2026 · Photo' },
    ];

    let currentIndex = 0;
    function openViewer(index) {
      currentIndex = index;
      const item = archive[index];
      document.getElementById('viewerImg').src = item.src;
      document.getElementById('viewerMeta').textContent = item.meta;
      document.getElementById('viewer').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeViewer() {
      document.getElementById('viewer').classList.remove('open');
      document.body.style.overflow = '';
    }
    function navViewer(dir) {
      currentIndex = (currentIndex + dir + archive.length) % archive.length;
      openViewer(currentIndex);
    }
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('viewer').classList.contains('open')) return;
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowLeft') navViewer(-1);
      if (e.key === 'ArrowRight') navViewer(1);
    });

    // Filters
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.gallery-item').forEach(item => {
          if (filter === 'all') {
            item.style.display = '';
          } else {
            const types = (item.dataset.type || '').split(' ');
            item.style.display = types.includes(filter) ? '' : 'none';
          }
        });
      });
    });
  </script>
