<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photos — DETTYVERSE</title>
<meta name="description" content="The DETTYVERSE photo archive." />
<link rel="canonical" href="https://dettyverse.example/photos.html" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF0844'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { font-family: 'Inter', var(--font-body); }
  h1, h2, h3, h4 { font-family: 'Fraunces', var(--font-display); }
  .compact-head { padding-top: calc(var(--space-6) + 3rem); padding-bottom: var(--space-4); }
  .compact-head h1 { font-size: var(--text-xl); margin-bottom: var(--space-4); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="dv-nav"></div>

<main id="main">
  <div class="container compact-head">
    <h1>Photos</h1>
    <div class="filter-bar" id="filterBar" style="border-bottom:none; margin-bottom:0;">
      <button data-filter="all" class="is-active">All</button>
      <button data-filter="Portraiture">Portraiture</button>
      <button data-filter="Editorial">Editorial</button>
      <button data-filter="Nightlife">Nightlife</button>
      <button data-filter="Visual Diary">Diary</button>
    </div>
  </div>

  <div class="container">
    <div class="rhythm-grid" id="photoGrid" style="margin-bottom: var(--space-7);"></div>
  </div>
</main>

<div id="dv-footer"></div>

<script src="js/gate.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
  const grid = document.getElementById("photoGrid");
  const filterBar = document.getElementById("filterBar");
  let activeFilter = "all";

  function renderGrid() {
    const items = activeFilter === "all"
      ? DV.photos
      : DV.photos.filter(p => p.category === activeFilter);
    grid.innerHTML = items.map((p, i) => DVApp.photoCardHtml(p, i)).join("");

    grid.querySelectorAll(".media-card:not(.media-card--locked)").forEach((card) => {
      card.addEventListener("click", (e) => {
        e.preventDefault();
        const id = card.dataset.id;
        const idx = items.findIndex(p => p.id === id);
        DVApp.openLightbox(items, idx);
      });
    });
  }

  filterBar.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    filterBar.querySelectorAll("button").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    activeFilter = btn.dataset.filter;
    renderGrid();
  });

  renderGrid();
</script>
</body>
</html>
